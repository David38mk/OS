# Linux box for testing the course scripts and C programs.
#   docker compose up -d --build      build (first time) and start
#   ssh -p 2222 david@localhost       log in (your ~/.ssh/id_ed25519 key, or password "os")
#   docker exec -it oslab bash        shell without ssh
#   docker compose down               stop and remove the container (image and repo stay)
# The repo is bind-mounted at /home/david/OS, so edits on Windows are visible immediately.
services:
  oslab:
    build: ./docker
    image: oslab
    container_name: oslab
    hostname: oslab
    ports:
      - "127.0.0.1:2222:22"          # localhost only
    volumes:
      - .:/home/david/OS
      - ${USERPROFILE}/.ssh/id_ed25519.pub:/keys/authorized_keys:ro
    working_dir: /home/david/OS
    cap_add:
      - SYS_PTRACE                   # gdb / strace
    security_opt:
      - seccomp=unconfined
    shm_size: 256m
    restart: unless-stopped
